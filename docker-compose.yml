# ════════════════════════════════════════════════════════════════
# Vachan.ai — local infrastructure for Phase 0.
#
# n8n analogy: this file is like the "credentials + service nodes" tab —
# it stands up the two backing services (Postgres, Redis) the app talks to,
# so you don't install them by hand. Bring it up with:  docker compose up -d
# ════════════════════════════════════════════════════════════════
services:
  # Postgres WITH the pgvector extension preinstalled (pgvector/pgvector image).
  # We store style fingerprints as VECTOR columns, so a plain postgres image
  # would be missing the `vector` type. This image ships it.
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: vachan
      POSTGRES_PASSWORD: vachan
      POSTGRES_DB: vachan
    ports:
      # Default 5432 matches the app's config defaults and existing .env files.
      # If a system Postgres already owns 5432, compose fails loudly at bind —
      # set DB_PORT in the root .env (compose reads it) and update DATABASE_URL.
      - "${DB_PORT:-5432}:5432"
    # Named volume (not a bind mount): `docker compose down -v` truly wipes it,
    # so the DB really resets from scratch when you want a clean slate.
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vachan -d vachan"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  redisdata:
