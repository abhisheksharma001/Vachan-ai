# Alembic configuration for Vachan.ai.
# The database URL is injected at runtime from app settings (DATABASE_URL_SYNC,
# the OWNER role) in migrations/env.py — NOT hardcoded here.
[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os

# Migration filenames: 0001_slug, 0002_slug, ... (zero-padded, sortable).
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
